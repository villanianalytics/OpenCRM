# Reject common automated probes before they reach PHP/OpenCRM.
# Keep legitimate public and authenticated OpenCRM routes out of this list.
<LocationMatch "(?i)^/(?:generate|api/generate|api/v1/generate|v1/completions|v1/chat/completions|v1/responses|v1/messages|api/chat|completion|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|\.env)(?:/.*)?$">
    Require all denied
</LocationMatch>

# Do not disclose the Apache version on error responses.
ServerTokens Prod
ServerSignature Off
